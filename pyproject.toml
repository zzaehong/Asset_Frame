[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asset-frame"
version = "0.1.0"
description = "Risk-first investment decision data foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "psycopg[binary]>=3.3,<4",
    "uvicorn>=0.46,<0.47",
]

[project.scripts]
asset-frame = "asset_frame.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asset_frame"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
