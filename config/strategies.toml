# 전략 후보 (PRD 7절). 전략을 추가·삭제하거나 비중을 바꾸면 PRD와 ADR을 함께 확인한다.
# kind = "fixed": weights 합이 1. kind = "equal_weight": members의 편입 가능한 자산을 동일가중.
# 편입 가능 자산이 모자란 달은 있는 자산에 비중을 비례 배분하고 coverage로 표시한다.
schema_version = 1

[[strategies]]
id = "bench_spy"
role = "benchmark"
kind = "fixed"
weights = { SPY = 1.0 }

[[strategies]]
id = "bench_6040"
role = "benchmark"
kind = "fixed"
weights = { SPY = 0.6, IEF = 0.4 }

[[strategies]]
id = "all_weather_approx"
role = "regime_diversified"
kind = "fixed"
weights = { SPY = 0.30, TLT = 0.40, IEF = 0.15, GLD = 0.075, DBC = 0.075 }

[[strategies]]
id = "permanent"
role = "regime_diversified"
kind = "fixed"
weights = { SPY = 0.25, TLT = 0.25, GLD = 0.25, BIL = 0.25 }

[[strategies]]
id = "equal_weight"
role = "naive_baseline"
kind = "equal_weight"
members = "level1_anchors"

# 추정 비중 전략: 직전 window_months(기본 36)개월 수익률로 비중을 추정한다. 창에 모든 달이 있는
# 자산만 쓴다. max_weight(자산당 상한)는 임의 선택이며 민감도 분석 대상이다.
[[strategies]]
id = "inv_vol"
role = "risk_balanced_simple"
kind = "inv_vol"
members = "level1_anchors"

[[strategies]]
id = "erc"
role = "risk_balanced"
kind = "erc"
members = "level1_anchors"

[[strategies]]
id = "min_variance"
role = "diversification"
kind = "min_variance"
members = "level1_anchors"
max_weight = 0.30

# min_variance 상한 민감도(20·40%). 본 전략의 30%는 임의 선택이라 같은 규칙으로 나란히 비교한다.
[[strategies]]
id = "min_variance_cap20"
role = "sensitivity"
kind = "min_variance"
members = "level1_anchors"
max_weight = 0.20

[[strategies]]
id = "min_variance_cap40"
role = "sensitivity"
kind = "min_variance"
members = "level1_anchors"
max_weight = 0.40
