# 상장 전 구간을 이어 붙일 대용 펀드(Tiingo, 일간 총수익 지수). 대상(target)의 첫 수익률 달 이전에만 쓰고
# 항상 대용으로 표시한다. fidelity: index(같은 지수) / close(같은 시장·비슷한 만기) / rough(사용자가 알고 고른 거친 대용).
# 사용 여부는 겹치는 구간(대상 상장 후)의 월수익률 상관이 등급 기준(index 0.97, close 0.90) 이상이고 36개월 이상일 때만.
# 대용이 없는 자산(은·원자재·섹터·스타일·SCHD 등)은 확장하지 않고 상장 이후만 쓴다(2026-11-21 결정).
