# 개별주 관찰 목록 후보 (ADR-0010, PRD 5.3절)
# 추적 중인 ETF의 큰 보유 종목을 모은 **사용자 확인용 후보**다. 도구가 종목을 고르지 않는다.
# 사용자가 고른 종목만 config/stocks.toml에 기록한다(최대 50종목).
# 보유 관계는 작성자(AI)의 기억 기준 근사다(2026-11-22 작성, 직접 확인한 값이 아님). 비중은 수시로 바뀌므로
# 아래 운용사 페이지에서 직접 확인한다. 자동 수집하지 않는다(AGENTS 3절).
# 확인 위치(운용사 사이트 루트, 검토일 없음 = 아직 사람이 확인하지 않음):
#   SPY·섹터 SPDR  https://www.ssga.com
#   QQQ            https://www.invesco.com
#   DVY            https://www.ishares.com
#   VIG·VNQ        https://investor.vanguard.com
#   SCHD           https://www.schwabassetmanagement.com
# ticker는 Tiingo 표기다(클래스 B 주식은 BRK-B).

